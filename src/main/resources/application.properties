spring.application.name=amigos
# Reemplaza 'tu_base_de_datos' por el nombre real de tu BD
spring.datasource.url=jdbc:mysql://localhost:3306/primerabase
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Indica el driver correspondiente (este ejemplo es para MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración básica para Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
